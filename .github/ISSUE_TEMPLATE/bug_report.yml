name: Bug report
description: Report a bug in mcp-recon (CLI crash, wrong output, broken transport, etc.)
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The more reproducible the report, the faster
        the fix. If you have a JSON output that triggered the bug, please
        attach it (or paste a minimal slice).

        For **classifier-output** bugs ("the classifier flagged the wrong
        thing"), please use the *Classifier finding* template instead — it
        captures the structured fields we need.

  - type: input
    id: command
    attributes:
      label: What command did you run?
      description: The exact `mcp-recon ...` invocation, including flags.
      placeholder: mcp-recon scan stdio:npx @modelcontextprotocol/server-filesystem /tmp
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: What input / server-spec did you give it?
      description: |
        Server-spec, input file, or stdin. If the bug needs a specific MCP
        server to reproduce, name it (or attach the inventory JSON).
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include full stderr / stack trace / exit code if applicable.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mcp-recon version
      description: Output of `mcp-recon --version` (or the git SHA if you built from source).
      placeholder: v0.1.2
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 14.5 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v20.11.0
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, related issues, hunches.
    validations:
      required: false
