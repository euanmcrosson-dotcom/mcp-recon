[package]
name = "mcp-recon-cli"
description = "Command-line interface for mcp-recon — discover MCP tool surface and emit findings.v1"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "mcp-recon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
mcp-recon-core = { path = "../mcp-recon-core", version = "0.0.11" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
ureq = { version = "2", features = ["tls"] }
which = "6.0"
